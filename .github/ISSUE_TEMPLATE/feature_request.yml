name: Feature request
description: Suggest a change or a new option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem you hit, in your own words. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
